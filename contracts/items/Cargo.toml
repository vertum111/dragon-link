[package]
name = "dragonlink-items"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
description = "Dragon Link items: every in-game good as a NEP-245 multi token, plus signed merchant trades"
license = "MIT"
repository = "https://github.com/"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
